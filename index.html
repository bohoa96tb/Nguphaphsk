<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#146d65">
<title>Ngữ pháp HSK · Nghe và giao tiếp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ef;--card:#fffdf9;--ink:#1c1917;--mute:#78716c;--line:#e8dfcf;--red:#146d65;--red2:#9f0d25;--redbg:#fdecee;--jade:#0f766e;--jadebg:#e2f4f0;--amber:#a85a07;--amberbg:#fef3dc;--blue:#1d4ed8;--bluebg:#e7eefe;--shadow:0 1px 2px rgba(60,40,10,.06),0 12px 26px -16px rgba(60,40,10,.30);--zh:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;--sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--serif:'Noto Serif SC','Songti SC',serif}
[data-theme=dark]{--bg:#14110f;--card:#201c18;--ink:#f5efe6;--mute:#a8a29e;--line:#383129;--red:#ef4455;--red2:#ff6b78;--redbg:#3b1920;--jade:#34d3b6;--jadebg:#11322d;--amber:#f5b556;--amberbg:#3a2a10;--blue:#9db9ff;--bluebg:#18244d;--shadow:0 12px 26px -16px rgba(0,0,0,.8)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.62;font-size:16px;padding-bottom:calc(5.6rem + env(safe-area-inset-bottom));min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(620px 320px at 100% 0,rgba(200,16,46,.08),transparent 60%),radial-gradient(520px 320px at 0 100%,rgba(168,90,7,.07),transparent 60%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
.zh{font-family:var(--zh)}
mark{background:linear-gradient(transparent 55%,rgba(200,16,46,.28) 55%);color:var(--red);font-weight:800;padding:0 1px}
[data-theme=dark] mark{background:linear-gradient(transparent 55%,rgba(239,68,85,.38) 55%)}
.nopy .py{display:none}.novi .vi{display:none}

/* ---------- khung ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
@supports (backdrop-filter:blur(1px)){.top{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px)}}
.top-in{max-width:760px;margin:0 auto;padding:.55rem 1rem;display:flex;align-items:center;gap:.7rem}
.logo{width:38px;height:38px;border-radius:10px;background:var(--red);color:#fff;font:900 1.2rem var(--serif);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px -6px var(--red);transform:rotate(-4deg)}
.ttl{flex:1;min-width:0}.ttl b{display:block;font-weight:800;font-size:.95rem;letter-spacing:-.01em;line-height:1.2}.ttl small{display:block;color:var(--mute);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;color:var(--mute)}
.ib.on{background:var(--redbg);color:var(--red)}
main{max-width:760px;margin:0 auto;padding:1rem 1rem 2rem}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 .7rem calc(.5rem + env(safe-area-inset-bottom));pointer-events:none}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:4px;pointer-events:auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:.42rem 0 .36rem;border-radius:17px;font-size:.66rem;font-weight:700;color:var(--mute)}
.tab i{font-style:normal;font-size:1.2rem;line-height:1.25}
.tab.on{background:var(--redbg);color:var(--red)}
#player{position:fixed;left:0;right:0;bottom:calc(4.9rem + env(safe-area-inset-bottom));z-index:29;padding:0 .8rem;display:none}
#player.on{display:block}
.pl{max-width:560px;margin:0 auto;background:#241c1a;color:#fff;border-radius:18px;padding:.6rem .7rem .6rem 1rem;display:flex;align-items:center;gap:.7rem;box-shadow:0 14px 30px -12px rgba(0,0,0,.6)}
.pl div{flex:1;min-width:0}.pl small{display:block;color:#d6b98b;font-size:.7rem;font-weight:700}.pl span{display:block;font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl button{background:var(--red);color:#fff;border-radius:12px;padding:.5rem .8rem;font-weight:800;font-size:.8rem}
#toast{position:fixed;left:50%;bottom:7.2rem;transform:translateX(-50%);background:#241c1a;color:#fff;padding:.6rem 1rem;border-radius:14px;font-size:.85rem;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
#toast.on{opacity:1}

/* ---------- thành phần ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:1.1rem 1.15rem;margin-bottom:.95rem}
.h1{font:900 1.55rem/1.25 var(--serif);letter-spacing:-.01em}
.h2{font-size:1.02rem;font-weight:800;display:flex;align-items:center;gap:.5rem;margin-bottom:.65rem}
.h2 i{font-style:normal;width:26px;height:26px;border-radius:8px;background:var(--redbg);color:var(--red);display:inline-flex;align-items:center;justify-content:center;font-size:.9rem}
.mute{color:var(--mute)}.sm{font-size:.82rem}
.row{display:flex;align-items:center;gap:.7rem}.wrap{flex-wrap:wrap}.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:46px;padding:.6rem 1.1rem;border-radius:14px;font-weight:800;font-size:.92rem;background:var(--card);border:1.5px solid var(--line)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 10px 20px -10px var(--red)}
.btn.gho{background:transparent}.btn.blk{display:flex;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:.18rem .6rem;border-radius:99px;background:var(--redbg);color:var(--red)}
.pill.j{background:var(--jadebg);color:var(--jade)}.pill.a{background:var(--amberbg);color:var(--amber)}.pill.b{background:var(--bluebg);color:var(--blue)}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;flex:1}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--red),#e8833a)}
.bar.g i{background:linear-gradient(90deg,var(--jade),#5ccf9c)}
.seal{flex:none;width:44px;height:44px;border-radius:11px;background:var(--red);color:#fff;font:900 1.35rem var(--serif);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.22)}
.lv{display:flex;gap:.5rem;overflow-x:auto;padding:.2rem 0 .7rem;scrollbar-width:none}.lv::-webkit-scrollbar{display:none}
.lvb{flex:none;padding:.5rem 1.1rem;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-weight:800;font-size:.85rem}
.lvb.on{background:var(--red);color:#fff;border-color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:.95rem}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.7rem .5rem;text-align:center}.st b{display:block;font:900 1.3rem var(--serif)}.st small{font-size:.7rem;color:var(--mute);font-weight:600}
.lcard{display:block;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:1rem 1.1rem;margin-bottom:.8rem}
.lcard .zh{font:900 1.2rem/1.3 var(--serif)}
.hero{background:linear-gradient(135deg,#146d65,#8f0b22);color:#fff;border-radius:24px;padding:1.3rem 1.25rem;margin-bottom:.95rem;position:relative;overflow:hidden;box-shadow:0 18px 34px -18px #7a0a1d}
.hero::after{content:"语";position:absolute;right:-.5rem;top:-1.6rem;font:900 8rem/1 var(--serif);opacity:.12}
.hero .h1{font-size:1.4rem}.hero p{opacity:.9;font-size:.88rem;margin-top:.3rem;max-width:30ch}
.hero .btn{margin-top:.9rem;background:#fff;color:#8f0b22;border-color:#fff}

/* ---------- công thức, ví dụ, bẫy ---------- */
.pat{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem}
.plus{color:var(--mute);font-weight:800}
.chip{display:inline-block;padding:.38rem .8rem;border-radius:12px;font-weight:700;font-size:.9rem;border:1.5px solid transparent}
.k-a{background:var(--bluebg);color:var(--blue)}.k-o{background:var(--jadebg);color:var(--jade)}.k-n{background:var(--line);color:var(--ink)}
.k-k{background:var(--red);color:#fff;font:900 1.25rem var(--zh);padding:.25rem .85rem}
.formula{background:linear-gradient(135deg,var(--redbg),transparent);border:1.5px dashed var(--red);border-radius:18px;padding:1rem;margin-bottom:.95rem}
.formula .mean{margin-top:.7rem;font-weight:700;font-size:.92rem}
.par{margin-bottom:.7rem}.par:last-child{margin-bottom:0}
.tw{overflow-x:auto;margin-top:.8rem}
table{border-collapse:collapse;width:100%;font-size:.95rem;text-align:center}
th,td{border:1px solid var(--line);padding:.55rem .6rem}th{background:var(--bg);font-size:.78rem;color:var(--mute);font-weight:700}
td.zh{font-size:1.15rem}td.key,th.key{background:var(--redbg);color:var(--red);font-weight:800}
.ex{display:flex;gap:.7rem;padding:.8rem 0;border-top:1px solid var(--line)}.ex:first-of-type{border-top:0;padding-top:.2rem}
.spk{flex:none;width:42px;height:42px;border-radius:50%;background:var(--redbg);color:var(--red);font-size:1.05rem;display:flex;align-items:center;justify-content:center}
.exb{flex:1;min-width:0}.exb .z{font:500 1.28rem/1.5 var(--zh)}.py{color:var(--mute);font-size:.86rem;font-style:italic}.vi{font-size:.93rem}
.note{margin-top:.3rem;font-size:.8rem;color:var(--amber);background:var(--amberbg);display:inline-block;padding:.15rem .6rem;border-radius:9px}
.trap{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:.7rem}
.trap>div{padding:.55rem .9rem;display:flex;gap:.6rem;align-items:flex-start}
.trap .bad{background:var(--redbg)}.trap .bad .zh{text-decoration:line-through;text-decoration-color:var(--red)}
.trap .good{background:var(--jadebg)}.trap .why{font-size:.86rem;color:var(--mute)}
.trap .x{font-weight:900;color:var(--red)}.trap .v{font-weight:900;color:var(--jade)}
.trap .zh{font-size:1.15rem}
.tip{background:var(--amberbg);color:var(--ink);border-radius:14px;padding:.7rem .9rem;margin-bottom:.5rem;font-size:.92rem;border-left:4px solid var(--amber)}
.pt{display:flex;gap:.85rem;align-items:flex-start;padding:1rem 1.1rem}
.pt .bd{flex:1;min-width:0}.pt h3{font-size:1rem;font-weight:800;line-height:1.35;margin-bottom:.4rem}
.pnav{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.4rem}

/* ---------- bài tập ---------- */
.qhead{display:flex;align-items:center;gap:.7rem;margin-bottom:.9rem}.qhead a{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800}
.qno{font-size:.8rem;font-weight:800;color:var(--mute)}
.stem{font:600 1.25rem/1.55 var(--zh);margin:.7rem 0 .3rem}.stem.vn{font:700 1.05rem/1.5 var(--sans)}
.gloss{color:var(--mute);font-size:.88rem;margin-bottom:.4rem}
.opts{display:grid;gap:.55rem;margin-top:.8rem}
.opt{text-align:left;padding:.8rem 1rem;border-radius:15px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:1rem;min-height:52px;display:flex;align-items:center;gap:.7rem}
.opt b{flex:none;width:28px;height:28px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--mute)}
.opt.zh{font-size:1.12rem}.opt.sel{border-color:var(--red);background:var(--redbg)}
.opt.ok{border-color:var(--jade);background:var(--jadebg)}.opt.bad{border-color:var(--red);background:var(--redbg)}
.bl{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem;font:600 1.3rem/2.1 var(--zh);margin:.5rem 0}
.blank{width:4.4rem;text-align:center;font:700 1.15rem var(--zh);border:0;border-bottom:3px solid var(--red);background:var(--redbg);border-radius:8px 8px 0 0;padding:.25rem .3rem;outline:none}
.blank:focus{background:var(--bluebg);border-color:var(--blue)}.blank.ok{border-color:var(--jade);background:var(--jadebg)}.blank.bad{border-color:var(--red)}
.ans{min-height:64px;border:2px dashed var(--line);border-radius:16px;padding:.5rem;display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin:.7rem 0}
.ans.ok{border:2px solid var(--jade);background:var(--jadebg)}.ans.bad{border:2px solid var(--red);background:var(--redbg)}
.bank{display:flex;flex-wrap:wrap;gap:.5rem;min-height:48px}
.tok{padding:.55rem .95rem;border-radius:13px;background:var(--card);border:1.5px solid var(--line);font:700 1.15rem var(--zh);box-shadow:0 3px 0 var(--line)}
.ans .tok{background:var(--bluebg);border-color:var(--blue);box-shadow:0 3px 0 var(--blue)}
.big-spk{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;padding:.9rem;border-radius:16px;background:var(--redbg);color:var(--red);font-weight:800;margin:.5rem 0}
.fb{border-radius:16px;padding:.9rem 1rem;margin-top:.9rem;border:1.5px solid}
.fb.ok{background:var(--jadebg);border-color:var(--jade)}.fb.no{background:var(--redbg);border-color:var(--red)}
.fb b.t{display:block;font-size:1.02rem;margin-bottom:.2rem}.fb .ca{font:700 1.15rem var(--zh);margin:.2rem 0}.fb .why{font-size:.9rem}
.fb a{color:var(--red);font-weight:800;font-size:.85rem;display:inline-block;margin-top:.4rem}
.foot{display:grid;gap:.6rem;margin-top:1rem}
.ring{width:132px;height:132px;margin:.4rem auto;position:relative}.ring svg{transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring b{font:900 2rem var(--serif)}
.wr{border-top:1px solid var(--line);padding:.8rem 0}.wr:first-child{border-top:0}
.sw{display:flex;align-items:center;justify-content:space-between;padding:.7rem 0;border-top:1px solid var(--line);gap:1rem}.sw:first-of-type{border-top:0}
.tg{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}.tg.on{background:var(--red)}.tg.on::after{left:23px}
.segs{display:flex;gap:.4rem;flex-wrap:wrap}.seg{padding:.45rem .85rem;border-radius:11px;border:1.5px solid var(--line);font-weight:700;font-size:.82rem}.seg.on{background:var(--red);border-color:var(--red);color:#fff}
.empty{text-align:center;padding:2.2rem 1rem;color:var(--mute)}.empty .e{font-size:2.6rem}
@media (min-width:700px){.opts.two{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* v2 — mobile reading and listening workspace */
:root{--red:#146d65;--redbg:#e6f3ed;--bg:#f5f3ec;--card:#fffef9;--ink:#183631;--jade:#24776c;--blue:#426f92;--line:#dde5dd}
body{padding-bottom:200px}h1{font-size:1.65rem;line-height:1.4;margin:.55rem 0}h2{font-size:1.2rem;margin:.6rem 0}p{line-height:1.85;margin:.65rem 0}button,a,input,select,summary{touch-action:manipulation}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #d39340;outline-offset:3px}
.card{border-radius:20px;box-shadow:0 2px 8px #17382c05}.hero{background:#173e37;color:#fff}.hero p{color:#e2e9df}.eyebrow,.breadcrumb{font-size:.72rem;letter-spacing:.12em;font-weight:800;color:#54816b}.hero .eyebrow{color:#b6d7bd}.breadcrumb{margin:1.1rem .3rem}.segs{margin-top:1rem}.hidden{display:none!important}
details{border-top:1px solid var(--line);padding:.9rem 0}details:last-child{padding-bottom:0}summary{cursor:pointer;font-weight:750;line-height:1.5;min-height:32px}details p{font-size:.96rem}details .btn{margin-top:.3rem}.compare{padding:.6rem 0;border-top:1px solid var(--line)}.compare .zh{font-size:1.2rem;font-weight:650}.draft{width:100%;min-height:115px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:.8rem;font-size:1rem;resize:vertical;margin:.7rem 0}.checklist{display:grid;gap:.6rem;margin:1rem 0}.checklist label{display:flex;align-items:center;gap:.5rem}.checklist input{width:19px;height:19px}.turn{border-left:4px solid #b4c9bc}.turn.speaker-b{border-left-color:#d6b67a;background:var(--card)}.turn.active{box-shadow:0 0 0 2px var(--red)}.dialog-zh{font-size:1.45rem;line-height:1.8;margin:.7rem 0}.dialog-vi{color:var(--mute);line-height:1.7;margin:.5rem 0}.mask{padding:1.1rem 0;color:var(--mute);letter-spacing:.1em;font-size:.8rem}.turn .btn{min-height:40px;min-width:42px}.vocab{border-bottom:1px dashed var(--line);padding:.65rem 0}.vocab .spk{display:inline-flex;vertical-align:middle;margin-left:.5rem}.py-inline{font-style:italic;color:var(--mute)}select,input[type=number]{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:.5rem;font-size:1rem}input[type=number]{width:65px}#recording{width:100%;margin:1rem 0}#player{bottom:calc(72px + env(safe-area-inset-bottom))}#player .pl{display:block;padding:.65rem 1rem;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);box-shadow:0 4px 24px #18363120;max-height:195px;overflow:auto}#player .pl>div:first-child{max-width:none}#pl-c{font-size:.87rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.audio-tools{display:flex;gap:.35rem;align-items:center;flex-wrap:wrap;margin-top:.4rem}#player .audio-tools button{background:var(--bg);color:var(--ink);border-radius:8px;width:auto;height:auto;padding:.45rem .65rem;font-size:.8rem;min-height:36px}#pl-count{font-size:.7rem;color:var(--mute);margin-left:auto}#app{max-width:820px}.top-in,.tabs-in{max-width:820px}#toast{z-index:1000}.tabs{padding-bottom:env(safe-area-inset-bottom)}
[data-theme=dark]{--bg:#14221f;--card:#1c2e29;--ink:#edf3ed;--line:#35473f;--red:#8fd1b8;--redbg:#29473c;--jade:#91d9bd}
@media(max-width:400px){.btn{padding:.65rem .8rem}.dialog-zh{font-size:1.3rem}.audio-tools{gap:.2rem}#player .audio-tools button{padding:.4rem}.card{padding:1rem}}

</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="logo zh" href="#/">语</a>
  <div class="ttl"><b>Ngữ pháp · Giao tiếp</b><small id="sub">Học · Luyện · Ôn lỗi sai</small></div>
  <button class="ib" id="btn-py" data-a="py" title="Bật/tắt pinyin">拼</button>
  <a class="ib" href="#/settings" title="Cài đặt">⚙</a>
</div></header>
<main id="app"></main>
<div id="player" aria-live="polite"><div class="pl"><div><small id="pl-t">Đang nghe</small><span id="pl-c"></span></div><div class="audio-tools"><button data-a="prevAudio" aria-label="Lượt trước">◀</button><button data-a="pause" id="pl-pause">Ⅱ Tạm dừng</button><button data-a="nextAudio" aria-label="Lượt sau">▶</button><button data-a="continueAudio" id="pl-continue" class="hidden">Đến lượt tôi · Tiếp tục</button><button data-a="stop">■ Dừng</button><label class="sm">Tốc độ <select id="player-rate" aria-label="Tốc độ đọc"><option value="0.7">0.7×</option><option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option></select></label><span id="pl-count"></span></div></div></div>
<div id="toast"></div>
<nav class="tabs"><div class="tabs-in" id="tabs"></div></nav>

<script src="manifest.js"></script>
<script>
(function(){
'use strict';
/* ===================== TIỆN ÍCH ===================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s||'').replace(/\*\*/g,'');
const hl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<mark>$1</mark>');
const cjk=s=>/[\u4e00-\u9fff]/.test(s||'');
const zc=s=>cjk(s)?' zh':'';
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)};
const norm=s=>String(s||'').replace(/[\s，。！？、,.!?;；:：“”‘’"'（）()—-]/g,'');
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let toastT;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)};

const KEY='HSK_GRAMMAR_V1';
const Store={d:null,
  load(){let x=null;try{x=JSON.parse(localStorage.getItem(KEY))}catch(e){}
    const b={seen:{},ans:{},mist:{},last:'',set:{pinyin:true,vi:true,rate:1,theme:'auto'}};
    this.d=Object.assign(b,x||{});this.d.set=Object.assign(b.set,(x&&x.set)||{})},
  save(){try{localStorage.setItem(KEY,JSON.stringify(this.d))}catch(e){}},
  record(lid,q,ok){const a=this.d.ans[q.id]||{n:0,ok:0};a.n++;if(ok)a.ok++;a.last=ok?1:0;this.d.ans[q.id]=a;
    if(ok)delete this.d.mist[q.id];else this.d.mist[q.id]=lid;this.save()},
  seenPoint(lid,pid){const k=lid+'#'+pid;if(!this.d.seen[k]){this.d.seen[k]=Date.now();this.save()}},
  pref(lid){let n=0,ok=0;for(const k in this.d.ans){if(k.startsWith(lid+'~')){n++;if(this.d.ans[k].last)ok++}}
    let s=0;for(const k in this.d.seen){if(k.startsWith(lid+'#'))s++}return{answered:n,ok,seen:s}},
  mistCount(){return Object.keys(this.d.mist).length}
};

/* ===================== DỮ LIỆU (MANIFEST + TẢI THEO BÀI) ===================== */
function normPat(p){return (p||[]).map(c=>Array.isArray(c)?[String(c[0]),c[1]||'n']:[String(c),'n'])}
function normQ(L,q){
  if(!q||!q.type)return null;const t=q.type;
  if(t==='choice'){if(!Array.isArray(q.options)||q.options.length<2||typeof q.answer!=='number'||q.answer<0||q.answer>=q.options.length){console.warn('Câu choice lỗi:',q);return null}}
  else if(t==='fill'){if(!q.stem||!Array.isArray(q.answers)||(q.stem.split('____').length-1)!==q.answers.length){console.warn('Câu fill lỗi (số ____ phải bằng số mảng answers):',q);return null}}
  else if(t==='order'){if(!Array.isArray(q.tokens)||q.tokens.length<2||!q.answer){console.warn('Câu order lỗi:',q);return null}}
  else return null;
  return Object.assign({},q,{id:L.id+'~'+hash(t+(q.stem||q.prompt||'')+JSON.stringify(q.answer!==undefined?q.answer:q.answers)+JSON.stringify(q.options||q.tokens||'')),point:q.point||'mix'});
}
function normLesson(r){
  if(!r||!r.id)return null;
  const L={id:String(r.id),level:String(r.level||'HSK1').toUpperCase().replace(/\s/g,''),number:+r.number||0,title:r.title||r.id,titleVi:r.titleVi||'',source:r.source||'',objectives:r.objectives||[],points:[],questions:[]};
  (r.points||[]).forEach((p,i)=>{if(!p)return;L.points.push({id:p.id||('p'+(i+1)),no:i+1,title:p.title||('Điểm '+(i+1)),cn:p.cn||'',pattern:normPat(p.pattern),meaning:p.meaning||'',summary:p.summary||'',explain:p.explain||[],table:p.table||null,examples:p.examples||[],traps:p.traps||[],tips:p.tips||[]})});
  (r.questions||[]).forEach(q=>{const n=normQ(L,q);if(n)L.questions.push(n)});
  return L;
}
const DS={man:[],lessons:{},failed:{},pend:{},lastErr:'',
  init(){this.man=(window.GRAMMAR_MANIFEST||[]).filter(m=>m&&m.id).map(m=>Object.assign({},m,{level:String(m.level||'HSK1').toUpperCase().replace(/\s/g,''),number:+m.number||0}));
    window.addEventListener('error',e=>{if(e&&e.filename&&/\.js/.test(e.filename))this.lastErr=e.message+' ('+String(e.filename).split('/').pop().split('?')[0]+':'+e.lineno+')'})},
  entry(id){return this.man.find(m=>m.id===id)||null},
  register(raw){const L=normLesson(raw);if(!L)return;this.lessons[L.id]=L;let e=this.entry(L.id);
    if(!e){e={id:L.id,level:L.level,number:L.number,title:L.title,titleVi:L.titleVi,file:null};this.man.push(e)}
    e.points=L.points.length;e.questions=L.questions.length;delete this.failed[L.id]},
  num(l){const n=parseInt(String(l).replace(/\D/g,''),10);return isNaN(n)?99:n},
  levels(){return [...new Set(this.man.map(m=>m.level))].sort((a,b)=>this.num(a)-this.num(b))},
  of(lv){return this.man.filter(m=>m.level===lv).sort((a,b)=>a.number-b.number)},
  load(id){if(this.lessons[id])return Promise.resolve();if(this.pend[id])return this.pend[id];
    const e=this.entry(id);if(!e||!e.file)return Promise.reject(new Error('Bài "'+id+'" chưa có tệp trong manifest.js'));
    const p=new Promise((res,rej)=>{const s=document.createElement('script');this.lastErr='';
      s.src=e.file+(e.v?'?v='+encodeURIComponent(e.v):'');
      s.onload=()=>this.lessons[id]?res():rej(new Error('Tệp '+e.file+' đã tải nhưng không đăng ký được bài "'+id+'". '+(this.lastErr?'Lỗi: '+this.lastErr:'Kiểm tra id trong tệp và manifest.js.')));
      s.onerror=()=>rej(new Error('Không tải được '+e.file+' (sai đường dẫn hoặc chưa đăng lên GitHub).'));
      document.head.appendChild(s)});
    this.pend[id]=p;p.then(()=>{delete this.pend[id]},err=>{delete this.pend[id];this.failed[id]=err.message});return p}
};
window.GRAMMAR_REGISTER=r=>DS.register(r);

const Speak={tok:0,voices:[],u:null,
  init(){if(!('speechSynthesis' in window))return;const g=()=>{this.voices=speechSynthesis.getVoices()};g();speechSynthesis.onvoiceschanged=g},
  pick(lang){const p=lang.slice(0,2).toLowerCase();const vs=this.voices.filter(v=>v.lang.toLowerCase().replace('_','-').startsWith(p));
    return vs.find(v=>/google|natural|online/i.test(v.name))||vs[0]||null},
  stop(){this.tok++;try{speechSynthesis.cancel()}catch(e){}Player.hide()},
  queue(items,onStep,onEnd){
    if(!('speechSynthesis' in window)){toast('Thiết bị không hỗ trợ đọc giọng nói.');return}
    this.stop();const t=this.tok,rate=+Store.d.set.rate||1;let i=0;
    const next=()=>{if(t!==this.tok)return;
      if(i>=items.length){Player.hide();onEnd&&onEnd();return}
      const it=items[i++],txt=strip(it.text).trim();if(!txt){next();return}
      onStep&&onStep(it);
      const u=new SpeechSynthesisUtterance(txt);this.u=u;u.lang=it.lang||'vi-VN';const v=this.pick(u.lang);if(v)u.voice=v;u.rate=rate;
      let done=false,w;const fin=()=>{if(done||t!==this.tok)return;done=true;clearTimeout(w);setTimeout(next,it.pause==null?300:it.pause)};
      u.onend=fin;u.onerror=e=>{if(e.error==='canceled'||e.error==='interrupted')return;fin()};
      w=setTimeout(fin,Math.max(5000,txt.length*(u.lang.startsWith('zh')?700:260)/rate+2500));
      speechSynthesis.speak(u)};
    next()}
};
const Player={show(t){$('#player').classList.add('on');$('#pl-t').textContent=t;$('#pl-c').textContent=''},cap(c){$('#pl-c').textContent=strip(c)},hide(){$('#player').classList.remove('on')}};
function mixed(text,pause){ // tách đoạn tiếng Việt / tiếng Trung để đọc đúng giọng
  const t=strip(text).replace(/\s=\s?/g,' tức là ').replace(/\s\+\s/g,' cộng ');
  const parts=t.split(/([\u4e00-\u9fff]+(?:[，。！？、：（）()\s·]*[\u4e00-\u9fff]+)*[。！？]?)/),out=[];
  parts.forEach(s=>{if(s&&s.trim())out.push({lang:cjk(s)?'zh-CN':'vi-VN',text:s,pause:120})});
  if(out.length)out[out.length-1].pause=pause==null?600:pause;return out}
function lecture(L,p){
  const it=[],v=(t,pa)=>it.push(...mixed(t,pa));
  v('Điểm ngữ pháp số '+p.no+': '+p.title+'.',600);
  if(p.summary)v(p.summary,700);
  p.explain.forEach(t=>v(t,700));
  if(p.examples.length){v('Bây giờ nghe các ví dụ.',500);p.examples.forEach(e=>{it.push({lang:'zh-CN',text:e.zh,pause:900});if(e.vi)v(e.vi,800)})}
  p.traps.forEach(t=>{if(t.why)v('Lưu ý. '+t.why,600)});
  p.tips.forEach(t=>v('Mẹo nhớ. '+t,600));
  return it}
function play(items,title){Player.show(title);Speak.queue(items,it=>Player.cap(it.text))}

function table(t){if(!t||!t.head)return '';

function mastery(L,pid){const qs=L.questions.filter(q=>q.point===pid);let ok=0,an=0;qs.forEach(q=>{const a=Store.d.ans[q.id];if(a){an++;if(a.last)ok++}});

const Quiz={s:null,
  prep(q){const o={q,perm:null,sel:null,inp:[],placed:[],done:false,ok:null};
    if(q.type==='choice')o.perm=shuffle(q.options.map((_,i)=>i));

  start(L,mode){let qs,title;
    if(mode.startsWith('p:')){const pid=mode.slice(2),p=L.points.find(x=>x.id===pid);qs=L.questions.filter(q=>q.point===pid);title='Luyện: '+(p?p.title:pid)}

  grade(it){const q=it.q;
    if(q.type==='choice')return it.perm[it.sel]===q.answer;
    if(q.type==='fill')return q.answers.every((acc,k)=>acc.map(norm).includes(norm(it.inp[k])));
    const got=norm(it.placed.map(i=>q.tokens[i]).join(''));return [q.answer].concat(q.alt||[]).map(norm).includes(got)},
  finish(it){it.ok=this.grade(it);it.done=true;Store.record(this.s.L.id,it.q,it.ok)}
};

async function route(){
  const t=++rtok;Speak.stop();const seg=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean).map(decodeURIComponent),app=$('#app');let tab='lib';
  try{
    if(!seg.length){app.innerHTML=viewLibrary()}

      if(!DS.entry(id)&&!DS.lessons[id]){app.innerHTML=errBox('Không tìm thấy bài "'+id+'".');setTabs('lib');return}
      if(!DS.lessons[id]){app.innerHTML=loading();setTabs('lib');await DS.load(id);if(t!==rtok)return}
      const L=DS.lessons[id];Store.d.last=id;Store.save();const sub=seg[2];
      if(sub==='p'){tab='les';app.innerHTML=viewPoint(L,seg[3]);Store.seenPoint(id,seg[3])}
      else if(sub==='practice'){tab='prac';app.innerHTML=viewPractice(L)}

      else{tab='les';app.innerHTML=viewLesson(L)}
    }else if(seg[0]==='mistakes'){tab='mis';const ids=[...new Set(Object.values(Store.d.mist))].filter(i=>DS.entry(i)&&!DS.lessons[i]);
      if(ids.length){app.innerHTML=loading();await Promise.all(ids.map(i=>DS.load(i).catch(()=>{})));if(t!==rtok)return}app.innerHTML=viewMistakes()}
    else if(seg[0]==='settings'){tab='set';app.innerHTML=viewSettings()}

const OldNormQ=normQ;
normQ=function(L,q){const n=OldNormQ(L,q);if(!n)return n;n.legacyId=n.id;if(q.id)n.id=L.id+'~'+q.id+'~v'+(q.version||1);return n;};

rn-'+i+'" class="card turn '+(t.speaker==='B'?'speaker-b':'')+'"><div class="row"><b class="sp">'+(i+1)+'. '+esc(d.speakers[t.speaker])+'</b>'+btn('▶','dOne','data-i="'+i+'" aria-label="Nghe lượt '+(i+1)+'"')+'</div><div class="dialog-zh zh '+(!D.text?'hidden':'')+'">'+esc(t.zh)+'</div><div class="dialog-vi '+(!D.vi?'hidden':'')+'">'+esc(t.vi)+'</div><div class="mask '+(D.text?'hidden':'')+'">••• Lời thoại đang ẩn</div>'+(t.note?'<details class="analysis '+(!D.text?'hidden':'')+'"><summary>Vì sao nói như vậy?</summary><p>'+esc(t.note)+'</p>'+(t.point?'<a href="'+lh(L.id)+'/p/'+t.point+'">Ôn điểm ngữ pháp →</a>':'')+'</details>':'')+'</article>').join('')+'</div><section class="card"><h2 class="h2">Kiểm tra hiểu hội thoại</h2><p>Trả lời trước, sau đó xem bằng chứng và nghe lại đúng câu.</p>'+btn('Làm '+d.checks.length+' câu','dQuiz','','pri')+'<p class="sm mute">'+(progress.completed?'Đã nghe/đọc đến cuối · ':'')+(progress.score!==undefined?'Kết quả gần nhất: '+progress.score+'/'+d.checks.length:'Chưa làm câu hỏi hội thoại')+'</p>'+btn('Tôi đã đọc toàn đoạn','dReadDone')+'</section>'+taskHtml(d.task,L.id+'-'+d.id)+'<section class="card"><h2 class="h2">🎙 Ghi âm để tự đối chiếu</h2><p class="sm mute">Ghi âm chỉ lưu tạm trên trang này; tải xuống nếu muốn giữ. Không tự chấm phát âm. Cần HTTPS hoặc localhost và quyền micro.</p><div class="row wrap">'+btn('Bắt đầu ghi','recStart')+btn('Dừng ghi','recStop')+'</div><p id="rec-status" role="status"></p><audio id="recording" controls class="hidden"></audio><a id="rec-download" class="btn hidden">Tải bản ghi</a></section>';}

function dItems(from=0,to=D.d.turns.length-1,reps=1){let items=[];for(let k=0;k<reps;k++)for(let i=from;i<=to;i++){const t=D.d.turns[i];items.push({text:t.zh,lang:'zh-CN',speaker:t.speaker,turn:i,label:D.d.speakers[t.speaker],hold:D.mode==='role'&&t.speaker===D.role,pause:D.mode==='shadow'?Math.max(1800,t.zh.length*260):650,hide:!D.text});}return items;}
function runD(from,to,reps){const id=D.L.id+'-'+D.d.id;Speak.queue(dItems(from,to,reps),it=>{D.index=it.turn;Store.d.dialog[id]={...Store.d.dialog[id],index:it.turn};Store.save();document.querySelectorAll('.turn.active').forEach(e=>e.classList.remove('active'));const el=$('#turn-'+it.turn);if(el){el.classList.add('active');el.scrollIntoView({block:'nearest',behavior:'smooth'});}},()=>{if(from===0&&to===D.d.turns.length-1){Store.d.dialog[id]={...Store.d.dialog[id],completed:Date.now()};Store.save();}toast('Đã phát xong đoạn.');},D.d.title);}

Object.assign(Speak,{items:[],pos:0,title:'',paused:false,waiting:false, timer:null,generation:0,
 stop(){this.generation++;clearTimeout(this.timer);this.waiting=false;this.paused=false;this.running=false;if('speechSynthesis'in window)speechSynthesis.cancel();Player.hide();},
 pick(lang,speaker){const vs=this.voices.filter(v=>v.lang.toLowerCase().replace('_','-').startsWith(lang.toLowerCase()));if(!vs.length)return null;return vs[speaker==='B'&&vs.length>1?1:0];},
 queue(items,onStep,onEnd,title='Nghe bài học'){this.stop();if(!('speechSynthesis'in window)){toast('Trình duyệt không hỗ trợ đọc. Bạn vẫn có thể đọc lời thoại.');return;}this.items=items;this.pos=0;this.onStep=onStep;this.onEnd=onEnd;this.title=title;this.running=true;this.next();},
 next(){if(this.pos>=this.items.length){const end=this.onEnd;this.stop();if(end)end();return;}const it=this.items[this.pos];this.onStep&&this.onStep(it);Player.show(this.title);Player.cap(it.hide?(it.hold?'Đến lượt bạn: '+it.label:'Đang nghe · '+(it.label||'')):it.text);$('#pl-count').textContent=(this.pos+1)+' / '+this.items.length;$('#pl-continue').classList.toggle('hidden',!it.hold);$('#pl-pause').textContent='Ⅱ Tạm dừng';this.waiting=!!it.hold;if(it.hold)return;
 const token=this.generation;const u=new SpeechSynthesisUtterance(strip(it.text));this.u=u;u.lang=it.lang||'vi-VN';u.rate=+Store.d.set.rate||1;const v=this.pick(u.lang,it.speaker);if(v)u.voice=v;
 u.onend=()=>{if(token!==this.generation)return;this.after=true;this.timer=setTimeout(()=>{if(token!==this.generation)return;if(this.paused)return;this.after=false;this.pos++;this.next();},it.pause??500);};
 u.onerror=e=>{if(token!==this.generation||e.error==='canceled'||e.error==='interrupted')return;this.stop();toast('Không phát được giọng '+u.lang+'. Kiểm tra giọng đọc trong cài đặt thiết bị.');};this.after=false;speechSynthesis.speak(u);},
 toggle(){if(!this.running||this.waiting)return;this.paused=!this.paused;if(this.paused){speechSynthesis.pause();clearTimeout(this.timer);}else if(this.after){this.after=false;this.pos++;this.next();}else speechSynthesis.resume();$('#pl-pause').textContent=this.paused?'▶ Tiếp tục':'Ⅱ Tạm dừng';},
 move(delta){if(!this.items.length)return;const next=Math.max(0,Math.min(this.items.length-1,this.pos+delta));this.generation++;clearTimeout(this.timer);speechSynthesis.cancel();this.pos=next;this.paused=false;this.running=true;this.next();},
 continue(){if(this.waiting){this.waiting=false;this.pos++;this.next();}}
});

let recorder=null,recordStream=null,recordUrl=null,recPending=false,recToken=0;
function stopRecording(){recToken++;recPending=false;if(recorder&&recorder.state!=='inactive')recorder.stop();if(recordStream)recordStream.getTracks().forEach(t=>t.stop());recordStream=null;}
Object.assign(A,{
 sectionAudio:d=>{const p=DS.lessons[d.l].points.find(p=>p.id===d.p);play(p.sections[+d.i].flatMap(x=>mixed(x)),'Giải thích · '+p.title);},
 taskDone:d=>{Store.d.practice[d.key+'-done']=Date.now();Store.save();toast('Đã ghi nhận bạn tự luyện.');},
 dMode:d=>{D.mode=d.mode;D.text=d.mode==='read';D.vi=false;stopRecording();renderD();},
 dText:()=>{D.text=!D.text;document.querySelectorAll('.dialog-zh,.analysis').forEach(e=>e.classList.toggle('hidden',!D.text));document.querySelectorAll('.mask').forEach(e=>e.classList.toggle('hidden',D.text));document.querySelector('[data-a="dText"]').textContent=D.text?'Ẩn chữ':'Hiện chữ';Speak.items.forEach(it=>it.hide=!D.text);if(Speak.running){const it=Speak.items[Speak.pos];Player.cap(D.text?it.text:'Đang nghe · '+(it.label||''));}},
 dVi:()=>{D.vi=!D.vi;document.querySelectorAll('.dialog-vi').forEach(e=>e.classList.toggle('hidden',!D.vi));document.querySelector('[data-a="dVi"]').textContent=D.vi?'Ẩn nghĩa':'Hiện nghĩa';},
 dPlay:()=>runD(0,D.d.turns.length-1,1),
 dResume:()=>{const p=Store.d.dialog[D.L.id+'-'+D.d.id];runD(Math.min(p?.index||0,D.d.turns.length-1),D.d.turns.length-1,1);},
 dRange:()=>{const f=+$('#range-from').value-1,t=+$('#range-to').value-1,r=+$('#repeat').value;if(!Number.isInteger(f)||!Number.isInteger(t)||f<0||t>=D.d.turns.length||f>t)return toast('Chọn khoảng lượt hợp lệ.');D.from=f;D.to=t;runD(f,t,r);},
 dOne:d=>runD(+d.i,+d.i,1),
 dReadDone:()=>{const k=D.L.id+'-'+D.d.id;Store.d.dialog[k]={...Store.d.dialog[k],completed:Date.now()};Store.save();toast('Đã ghi nhận đọc toàn đoạn.');},
 dQuiz:()=>{location.hash=lh(D.L.id)+'/dq/'+D.d.id;},
 pause:()=>Speak.toggle(),prevAudio:()=>Speak.move(-1),nextAudio:()=>Speak.move(1),continueAudio:()=>Speak.continue(),
 reviewDone:d=>{Store.d.review[d.key]=Date.now();Store.save();route();},
 recStart:async()=>{if(recPending||recorder&&recorder.state==='recording')return;if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return toast('Ghi âm cần trình duyệt hỗ trợ và HTTPS/localhost.');Speak.stop();recPending=true;const token=++recToken;try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});if(token!==recToken){stream.getTracks().forEach(t=>t.stop());return;}recordStream=stream;recPending=false;let chunks=[];recorder=new MediaRecorder(stream);const status=$('#rec-status'),el=$('#recording'),link=$('#rec-download');recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType});if(recordUrl)URL.revokeObjectURL(recordUrl);recordUrl=URL.createObjectURL(blob);if(el?.isConnected){el.src=recordUrl;el.classList.remove('hidden');link.href=recordUrl;link.download='luyen-noi.'+(blob.type.includes('mp4')?'m4a':'webm');link.classList.remove('hidden');status.textContent='Đã ghi xong. Nghe lại và đối chiếu câu mẫu.';}stream.getTracks().forEach(t=>t.stop());};recorder.start();status.textContent='● Đang ghi âm — bấm Dừng ghi khi xong.';}catch(e){recPending=false;toast('Chưa ghi âm được. Kiểm tra quyền micro và kết nối HTTPS.');}},
 recStop:()=>stopRecording()
});

viewSettings=function(){return oldSettings().replace('Phiên âm dưới câu ví dụ','Chỉ áp dụng bài cũ có phiên âm; bài mới chỉ dùng ở từ mới')+'<section class="card"><h2 class="h2">Kiểm tra giọng đọc</h2><p class="sm mute">Chất lượng và khả năng đọc khi tắt màn hình phụ thuộc trình duyệt, thiết bị. Nếu chỉ có một giọng tiếng Trung, hai vai dùng chung giọng.</p>'+spk('你好，我想看一下。','zh-CN')+spk('Đây là phần giảng bằng tiếng Việt.','vi-VN')+'</section>';};
const oldRoute=route;
route=async function(){stopRecording();const t=++rtok;const seg=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean).map(decodeURIComponent);Speak.stop();if(seg[0]==='l'&&['dialogs','dialog','dq','review'].includes(seg[2])){const app=$('#app');app.innerHTML=loading();try{await DS.load(seg[1]);if(t!==rtok)return;const L=DS.lessons[seg[1]];Store.d.last=L.id;if(!Store.d.started[L.id])Store.d.started[L.id]=Date.now();Store.save();if(seg[2]==='dialogs')app.innerHTML=viewDialogs(L);else if(seg[2]==='review')app.innerHTML=viewReview(L);else if(initD(L,seg[3])){if(seg[2]==='dq'){const d=D.d;Quiz.s={L,dialog:d,mode:'dialog',title:d.title,items:d.checks.map(q=>Quiz.prep(q)),i:0,exam:false};renderQuiz();}else app.innerHTML=viewDialogue();}else app.innerHTML=errBox('Không tìm thấy hội thoại.');setTabs(seg[2]==='review'?'mis':'dialog');window.scrollTo(0,0);}catch(e){app.innerHTML=errBox(e.message);}return;}return oldRoute();};
setTabs=function(tab){const id=Store.d.last&&DS.entry(Store.d.last)?Store.d.last:'';const T=[['lib','📚','Thư viện','#/'],['les','📖','Học bài',id?lh(id):'#/'],['dialog','🎧','Hội thoại',id?lh(id)+'/dialogs':'#/'],['prac','✍','Luyện tập',id?lh(id)+'/practice':'#/'],['mis','↻','Ôn lại',id?lh(id)+'/review':'#/mistakes']];$('#tabs').innerHTML=T.map(t=>'<a class="tab '+(t[0]===tab?'on':'')+'" href="'+t[3]+'"><i>'+t[1]+'</i>'+t[2]+'</a>').join('');const L=DS.lessons[id];$('#sub').textContent=L?L.level+' · Bài '+L.number:'Hiểu · Nghe · Giao tiếp';};
// Preserve legacy results only when the old content-based identifier still matches.
const registerBase=DS.register;
DS.register=function(raw){registerBase.call(this,raw);const L=this.lessons[raw.id];if(!L)return;for(const q of L.questions){if(q.legacyId!==q.id&&Store.d.ans[q.legacyId]){if(!Store.d.ans[q.id])Store.d.ans[q.id]=Store.d.ans[q.legacyId];delete Store.d.ans[q.legacyId];if(Store.d.mist[q.legacyId]){Store.d.mist[q.id]=L.id;delete Store.d.mist[q.legacyId];}}}Store.save();};
// A mock exam is committed only at submission, not after each selection.
Quiz.finish=function(it){it.ok=this.grade(it);it.done=true;if(!this.s.dialog&&!this.s.exam)Store.record(this.s.L.id,it.q,it.ok);};
const resultBaseV2=viewResult;
viewResult=function(){const s=Quiz.s;if(s.exam&&!s.committed){s.items.forEach(it=>Store.record(s.L.id,it.q,it.ok));s.committed=true;}return resultBaseV2();};
A.dOne=d=>{const i=+d.i;const t=D.d.turns[i];Speak.queue([{text:t.zh,lang:'zh-CN',speaker:t.speaker,turn:i,label:D.d.speakers[t.speaker],pause:0,hide:!D.text}],it=>{document.querySelectorAll('.turn.active').forEach(e=>e.classList.remove('active'));$('#turn-'+i)?.classList.add('active');},null,'Lượt '+(i+1));};
const settingsBaseV2=viewSettings;
viewSettings=function(){return settingsBaseV2()+'<section class="card"><h2 class="h2">Sổ lỗi của mọi bài</h2><a class="btn" href="#/mistakes">Mở sổ lỗi câu đơn</a><p class="sm mute">Kết quả câu hỏi hội thoại lưu riêng trong từng tình huống. Đọc qua bài không được tính là đã sử dụng thành thạo.</p></section>';};
document.addEventListener('change',e=>{if(e.target.id==='player-rate'){Store.d.set.rate=+e.target.value;Store.save();toast('Tốc độ mới áp dụng từ lượt kế tiếp.');}});
const libraryBaseV2=viewLibrary;
viewLibrary=function(){const id=Store.d.last;const progress=Object.entries(Store.d.dialog).filter(([k,v])=>k.startsWith(id+'-')&&v.index>0).at(-1);return (progress&&DS.entry(id)?'<section class="card"><span class="eyebrow">TIẾP TỤC LUYỆN NGHE</span><p>Bạn đã luyện đến lượt '+(progress[1].index+1)+'.</p><a class="btn pri" href="'+lh(id)+'/dialog/'+encodeURIComponent(progress[0].slice(id.length+1))+'">Mở lại hội thoại →</a></section>':'')+libraryBaseV2();};
const playerShowV2=Player.show;
Player.show=function(t){playerShowV2.call(this,t);$('#player-rate').value=String(Store.d.set.rate||1);};

// Only import a validated progress object. Keep old exports compatible.
document.addEventListener('change',e=>{if(e.target.id!=='imp')return;const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024)return toast('Tệp quá lớn.');const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);const obj=v=>v&&typeof v==='object'&&!Array.isArray(v);if(!obj(x)||!obj(x.ans)||!obj(x.set))throw Error();for(const [k,v] of Object.entries(x.ans))if(!obj(v)||![0,1].includes(v.last))throw Error();for(const k of ['seen','mist','dialog','practice','review','started'])if(x[k]!==undefined&&!obj(x[k]))throw Error();for(const [k,v] of Object.entries(x.mist||{}))if(typeof v!=='string')throw Error();for(const [k,v] of Object.entries(x.seen||{}))if(typeof v!=='number')throw Error();for(const k of ['seen','ans','mist','dialog','practice','review','started'])if(x[k])Store.d[k]=x[k];Store.d.last=typeof x.last==='string'?x.last:'';Store.d.set={pinyin:!!x.set.pinyin,vi:x.set.vi!==false,rate:[.7,.85,1,1.15].includes(x.set.rate)?x.set.rate:1,theme:['auto','dark','light'].includes(x.set.theme)?x.set.theme:'auto'};Store.save();applyTheme();route();toast('Đã nhập tiến trình.');}catch(err){toast('Tệp tiến trình không hợp lệ.');}};r.readAsText(f);});

/* ===================== KHỞI ĐỘNG ===================== */
Store.load();DS.init();Speak.init();applyTheme();
if(window.matchMedia)try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}
window.addEventListener('hashchange',route);
window.GrammarApp={DS,Store,Quiz,Speak,route,mixed,lecture,views:{viewLibrary,viewLesson,viewPoint,viewPractice,viewQuiz,viewResult,viewMistakes,viewSettings}};
route();
})();
</script>
